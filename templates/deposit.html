<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Deposit</title>
    <style>
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 18px; border-radius: 6px; background: #ddd; color: #222; text-decoration: none; }
        .tab.active { background: #087bff; color: white; }
        #status, #depositResult { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Deposit</h2>

        <nav class="tabs">
            <a class="tab" href="/">Transfer</a>
            <a class="tab active" href="/deposit">Deposit</a>
        </nav>

        <p>This records the depositor and amount on-chain. It does not transfer ETH.</p>

        <input id="amount" type="number" min="1" step="1" placeholder="Enter amount">
        <button type="button" class="btn" onclick="saveDeposit()">Save Deposit</button>
        <button type="button" class="btn" onclick="viewDeposit()">View Deposit</button>

        <p id="status">Ready.</p>
        <p id="depositResult"></p>

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
    <script>
        const DEPOSIT_CONTRACT_ADDRESS = "PASTE_DEPLOYED_DEPOSIT_CONTRACT_ADDRESS";

        const DEPOSIT_ABI = [
            {
                "inputs": [
                    {"name": "depositorInput", "type": "address"},
                    {"name": "amountInput", "type": "uint256"}
                ],
                "name": "depositMoney",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "viewDeposit",
                "outputs": [
                    {"name": "", "type": "address"},
                    {"name": "", "type": "uint256"}
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        function setStatus(message) {
            document.getElementById("status").innerText = message;
        }

        async function getDepositContract() {
            if (!window.ethereum) throw new Error("MetaMask was not detected.");
            if (typeof Web3 === "undefined") throw new Error("Web3.js did not load.");

            const web3 = new Web3(window.ethereum);

            if (!web3.utils.isAddress(DEPOSIT_CONTRACT_ADDRESS)) {
                throw new Error("Enter the deployed deposit contract address in the code.");
            }

            const code = await web3.eth.getCode(DEPOSIT_CONTRACT_ADDRESS);
            if (!code || code === "0x" || /^0x0*$/.test(code)) {
                throw new Error("Contract not found on the selected MetaMask network.");
            }

            return {
                web3,
                contract: new web3.eth.Contract(DEPOSIT_ABI, DEPOSIT_CONTRACT_ADDRESS)
            };
        }

        async function saveDeposit() {
            try {
                const amount = document.getElementById("amount").value.trim();

                if (!/^[1-9][0-9]*$/.test(amount)) {
                    throw new Error("Enter a positive whole-number amount.");
                }

                const { contract } = await getDepositContract();
                const accounts = await window.ethereum.request({
                    method: "eth_requestAccounts"
                });

                setStatus("Confirm the transaction in MetaMask.");

                const receipt = await contract.methods
                    .depositMoney(accounts[0], amount)
                    .send({ from: accounts[0] });

                setStatus("Deposit record saved. Transaction: " + receipt.transactionHash);
            } catch (error) {
                console.error(error);
                setStatus(error.message || "Deposit failed.");
            }
        }

        async function viewDeposit() {
            try {
                const { contract } = await getDepositContract();
                const result = await contract.methods.viewDeposit().call();

                document.getElementById("depositResult").innerText =
                    "Depositor: " + result[0] + " | Amount: " + result[1];

                setStatus("Deposit record loaded.");
            } catch (error) {
                console.error(error);
                setStatus(error.message || "Could not load the deposit record.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Transfer Money</title>
</head>
<body>
    <div class="container">
        <h2>Transfer Money</h2>

        <input id="payer" placeholder="Enter payer address">
        <input id="payee" placeholder="Enter payee address">
        <input id="amount" type="number" min="1" step="1" placeholder="Enter amount">

        <button type="button" class="btn" onclick="transfer()">Transfer</button>

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
    <script>
        const contractAddress = "0x5bb9cd5e5cdfc630082afbdd17a229d4d7d2da89";

        const contractABI = [{
            "inputs": [
                {"name": "payer_add", "type": "address"},
                {"name": "payee_add", "type": "address"},
                {"name": "amount_transfer", "type": "uint256"}
            ],
            "name": "transfer",
            "outputs": [],
            "stateMutability": "nonpayable",
            "type": "function"
        }];

        async function transfer() {
            try {
                if (!window.ethereum) throw new Error("MetaMask was not detected.");
                if (typeof Web3 === "undefined") throw new Error("Web3.js did not load.");

                const web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({
                    method: "eth_requestAccounts"
                });

                const payer = document.getElementById("payer").value.trim();
                const payee = document.getElementById("payee").value.trim();
                const amount = document.getElementById("amount").value;

                if (!web3.utils.isAddress(payer) || !web3.utils.isAddress(payee)) {
                    throw new Error("Enter valid wallet addresses.");
                }
                if (!/^[1-9][0-9]*$/.test(amount)) {
                    throw new Error("Enter a positive whole-number amount.");
                }

                const code = await web3.eth.getCode(contractAddress);
                if (code === "0x") {
                    throw new Error("Contract not found on the selected network.");
                }

                const contract = new web3.eth.Contract(contractABI, contractAddress);

                alert("Confirm the transaction in MetaMask.");
                await contract.methods.transfer(payer, payee, amount)
                    .send({ from: accounts[0] });

                alert("Transfer completed.");
            } catch (error) {
                console.error(error);
                alert(error.message || "Transfer failed.");
            }
        }
    </script>
</body>
</html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h2>Transfer Money</h2>

        <input type="text" id="payer" placeholder="Enter payer Address">
        <input type="text" id="payee" placeholder="Enter payee Address">
        <input type="number" id="amount" placeholder="Enter amount">

        <button type="button" class="btn" onclick="transfer()">Transfer</button>

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>

    <script>
        const contractAddress = "0x5bb9cd5e5cdfc630082afbdd17a229d4d7d2da89";

        const contractABI = [
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "payer_add",
                        "type": "address"
                    },
                    {
                        "internalType": "address",
                        "name": "payee_add",
                        "type": "address"
                    },
                    {
                        "internalType": "uint256",
                        "name": "amount_transfer",
                        "type": "uint256"
                    }
                ],
                "name": "transfer",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "transaction",
                "outputs": [
                    {
                        "internalType": "address",
                        "name": "",
                        "type": "address"
                    },
                    {
                        "internalType": "address",
                        "name": "",
                        "type": "address"
                    },
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        async function transfer() {
            try {
                if (!window.ethereum) {
                    alert("MetaMask가 필요합니다.");
                    return;
                }

                const accounts = await window.ethereum.request({
                    method: "eth_requestAccounts"
                });

                const payer = document.getElementById("payer").value;
                const payee = document.getElementById("payee").value;
                const amount = document.getElementById("amount").value;

                const web3 = new Web3(window.ethereum);
                const contract = new web3.eth.Contract(
                    contractABI,
                    contractAddress
                );

                await contract.methods.transfer(
                    payer,
                    payee,
                    amount
                ).send({
                    from: accounts[0]
                });

                alert("Transfer completed.");
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }
    </script>
</body>
</html>
